name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.13"]
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Lint
        run: uvx ruff check gpu_stress tests scripts gpu_stress_cli.py

      # The GPU-independent half of the suite: evaluation rules, telemetry
      # summaries, the step runner and the packaging helpers. The CUDA steps
      # themselves need a GPU and are covered by the hardware matrix in
      # docs/TESTED_GPUS.md.
      - name: Tests
        run: uv run --python ${{ matrix.python-version }} --extra dev python -m pytest tests -q

      - name: Build wheel + zipapp
        run: |
          uv build
          uv run --python ${{ matrix.python-version }} python scripts/build_zipapp.py dist

      - name: Zipapp smoke test (no GPU, must fail cleanly)
        run: |
          set +e
          output=$(python3 dist/gpu-stress.pyz --list 2>&1)
          code=$?
          set -e
          echo "$output"
          test $code -eq 0 || { echo "--list must work without a GPU"; exit 1; }
          echo "$output" | grep -q nbody

  shellcheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: sudo apt-get update && sudo apt-get install -y shellcheck
      # -S warning: fail on real problems, not on style nitpicks.
      - run: shellcheck -s sh -S warning install.sh
