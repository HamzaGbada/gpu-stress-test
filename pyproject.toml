[project]
name = "gpu-stress"
version = "0.2.0"
description = "Multi-step GPU stress test & evaluation pipeline. Zero-dependency CUDA driver-API edition plus an optional full PyTorch suite (ResNet50 training, torch.compile, mixed precision)."
requires-python = ">=3.10"
authors = [
    { name = "Hamza Gbada", email = "hamza.gbada@gmail.com" }
]
readme = "README.md"
license = { text = "MIT" }

# The lite pipeline needs nothing but the NVIDIA driver (libcuda + libnvidia-ml).
dependencies = []

[project.optional-dependencies]
# Full PyTorch suite (several GB of wheels).
torch = [
    "torch",         # pulled from the cu130 index below
    "torchvision",
]
# Telemetry plot (PNG / --gui) for either pipeline.
plot = ["matplotlib"]
dev = [
    "pytest",
    "ruff",
]

[project.scripts]
gpu-stress-lite = "gpu_stress.lite_pipeline:main"   # no torch needed
gpu-stress = "gpu_stress.torch_pipeline:main"        # needs the [torch] extra

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["gpu_stress"]

[tool.uv.sources]
torch = { index = "pytorch-cu130" }
torchvision = { index = "pytorch-cu130" }

[[tool.uv.index]]
name = "pytorch-cu130"
url = "https://download.pytorch.org/whl/cu130"
explicit = true

[tool.ruff]
line-length = 120
