[project]
name = "gpu-stress"
version = "0.3.1"
description = "Multi-step GPU stress test & evaluation pipeline. Zero-dependency CUDA driver-API edition plus an optional full PyTorch suite (ResNet50 training, torch.compile, mixed precision)."
requires-python = ">=3.10"
authors = [
    { name = "Hamza Gbada", email = "hamza.gbada@gmail.com" }
]
readme = "README.md"
license = { text = "MIT" }
keywords = ["gpu", "cuda", "stress-test", "benchmark", "nvidia", "memtest", "diagnostics"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: GPU :: NVIDIA CUDA",
    "Intended Audience :: Developers",
    "Intended Audience :: System Administrators",
    "License :: OSI Approved :: MIT License",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Python :: 3",
    "Topic :: System :: Benchmark",
    "Topic :: System :: Hardware",
]

# The lite pipeline needs nothing but the NVIDIA driver (libcuda + libnvidia-ml).
dependencies = []

[project.urls]
Homepage = "https://github.com/HamzaGbada/gpu-stress-test"
Issues = "https://github.com/HamzaGbada/gpu-stress-test/issues"
Changelog = "https://github.com/HamzaGbada/gpu-stress-test/blob/main/CHANGELOG.md"
"Tested GPUs" = "https://github.com/HamzaGbada/gpu-stress-test/blob/main/docs/TESTED_GPUS.md"

[project.optional-dependencies]
# Full PyTorch suite (several GB of wheels).
torch = [
    "torch",         # pulled from the cu130 index below
    "torchvision",
]
# Telemetry plot (PNG / --gui) for either pipeline.
plot = ["matplotlib"]
dev = [
    "pytest",
    "ruff",
]

[project.scripts]
gpu-stress-lite = "gpu_stress.lite_pipeline:main"   # no torch needed
gpu-stress = "gpu_stress.torch_pipeline:main"        # needs the [torch] extra

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["gpu_stress"]

[tool.hatch.build.targets.sdist]
include = ["gpu_stress", "tests", "scripts", "docs", "README.md", "CHANGELOG.md", "LICENSE", "install.sh"]

[tool.uv.sources]
torch = { index = "pytorch-cu130" }
torchvision = { index = "pytorch-cu130" }

[[tool.uv.index]]
name = "pytorch-cu130"
url = "https://download.pytorch.org/whl/cu130"
explicit = true

[tool.ruff]
line-length = 120

[tool.ruff.lint]
# Pinned explicitly so CI does not drift when ruff changes its defaults.
select = ["E", "F", "W", "I", "B", "UP", "SIM", "C4", "RUF"]
ignore = [
    "E501",     # long lines are handled by line-length, and tables/messages exceed it
    "B008",     # ctypes call-in-default patterns
    "SIM105",   # contextlib.suppress is not clearer in the driver teardown paths
]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["E731"]
